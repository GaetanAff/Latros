[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "latros"
version = "0.3.0"
description = "Offline research prototype for explainable rare-disease phenotype ranking"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.11,<3", "typer>=0.16,<1", "duckdb>=1.3,<2",
  "httpx>=0.28,<1", "orjson>=3.10,<4", "lxml>=5.4,<7", "PyYAML>=6,<7",
]

[project.scripts]
latros = "latros.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "lxml-stubs"]

[tool.hatch.build.targets.wheel]
packages = ["src/latros"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/latros"]
